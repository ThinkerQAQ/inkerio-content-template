name: Validate template
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  template:
    # Only maintainers of the original template need this validation job.
    if: github.repository == 'ThinkerQAQ/inkerio-content-template'
    name: Validate with Inkerio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: content
      - uses: actions/checkout@v6
        with:
          repository: ThinkerQAQ/inkerio
          path: engine
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
        working-directory: engine
      - run: node scripts/assemble-content.mjs --content-root ../content
        working-directory: engine
      - name: Verify example content is blocked from public deployment
        run: |
          if node scripts/check-publication.mjs; then
            echo 'Bundled demonstration content must not be published' >&2
            exit 1
          fi
        working-directory: content
      - name: Validate site configuration and publication safety
        run: node --test scripts/configure-site.test.mjs scripts/check-publication.test.mjs
        working-directory: content
      - run: npm run check
        working-directory: engine
      - name: Check license and synthetic records
        working-directory: content
        run: |
          test -s LICENSE
          test -s COPYRIGHT.md
          python3 - <<'PYCODE'
          import json, pathlib
          for p in pathlib.Path('src/content/workout-summaries').glob('*.json'):
              assert json.loads(p.read_text()).get('demo') is True, str(p)
          PYCODE
